<!doctype html>
<html>
  <head>
    <title>My Registration Form</title>
  </head>
  <body>
    <header>
      <h1>Registration Form</h1>
    </header>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" required />
      <br /><br />
      <label for="pwd">Password</label>
      <input type="password" id="pwd" />
      <br /><br />
      <label for="email-add">Email</label>
      <input type="email" id="email-add" />
      <br /><br />
      <label for="phone">Phone number</label>
      <input type="tel" id="phone" />
      <br /><br />
      <p>
        <label>Gender</label>
        <input type="radio" name="gender" id="male" required />
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" />
        <label for="female">Female</label>
        <input type="radio" name="gender" id="other" />
        <label for="other">other</label>
      </p>
      <p>
        <label>Hobbies</label>
        <input type="checkbox" id="cri" />
        <label for="cri">Cricket</label>
        <input type="checkbox" id="vb" />
        <label for="vb">Volley ball</label>
        <input type="checkbox" id="hockey" />
        <label for="hockey">hockey</label>
      </p>
      <p>
        <label>Country</label>
       <select>
        <option value="">India</option>
        <option value="">US</option>
        <option value="">UK</option>
        <option value="">Pak</option>
       </select>
      </p>
      <p>
        <label>Address</label>
        <textarea rows="6" cols="30"></textarea>
      </p>
      <p>
        <input type="file"/>
      </p>
      <input type="submit" value="Registration" />
      <button>Submit</button>
    </form>
  </body>
</html>
