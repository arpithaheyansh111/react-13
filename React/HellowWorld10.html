<script src="react.development.js"></script>
<script src="react-dom.development.js"></script>
<script src="babel.js"></script>

<div id="root"></div>

<script type="text/babel">
  function App() {
    return (
      <div>
      <Welcome pn="sachin" loc="mumbia"/>
      <Welcome pn="dhoni" loc="ranchi"/>
      <Welcome pn="kohli" loc="delhi"/>
      <Welcome pn="dravid" loc="mp"/>
      </div>
    );
  }

  function Welcome({pn,loc}) {
    return <div>Hey! Welcome {pn},from {loc}</div>;
  }

  ReactDOM.render(<App />, document.getElementById("root"));
</script>
