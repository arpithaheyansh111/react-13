<html>
  <head>
    <style>
      span:nth-child(2):hover {
        color: blue;
      }
    </style>
  </head>
  <body>
    <div>
      <span>Red</span>
      <span>Blue</span>
      <span>Yellow</span>
    </div>
    <span>React</span>
    <span>Angular</span>
    <p>
      <b>Pune</b>
      <span>Hyderabad</span>
      <i>MP</i>
    </p>
  </body>
</html>
