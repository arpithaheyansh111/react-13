

<style>
    div{
        width: 200px;
        height: 200px;
        border: 5px solid red;
        padding: 20px;
        box-sizing: border-box;
        margin: 10px;
    }
</style>
<div>Box</div>
<!-- In CSS, box-sizing controls how the browser calculates an element's total width and height.
There are two important values:
1. content-box — default value.
2. border-box — includes padding and border within the specified width and height. -->
